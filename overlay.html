<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<style>
  * { box-sizing:border-box; font-family:'Pretendard','Malgun Gothic',system-ui,sans-serif;
      -webkit-user-select:none; }
  html,body { margin:0; width:100vw; height:100vh; overflow:hidden; background:transparent; cursor:default; }
  #layer { position:fixed; inset:0; pointer-events:none; }
  .on { pointer-events:auto; }

  /* ---- 미션 카드 (업무 알림처럼 생긴 작은 창) ---- */
  #mission { position:fixed; right:18px; bottom:18px; width:260px; background:#fbfbfb; color:#1b1b1b;
             border:1px solid #d6d6d6; border-radius:7px; box-shadow:0 8px 24px rgba(0,0,0,.28);
             display:none; overflow:hidden; font-size:12px; }
  #mission.show { display:block; }
  .m-head { background:#f1f1f1; border-bottom:1px solid #e2e2e2; padding:6px 10px; font-size:11px;
            color:#555; display:flex; align-items:center; gap:6px; }
  .m-head .ic { width:11px; height:11px; border-radius:3px; background:#2b7a2b; }
  .m-head.target .ic { background:#c62828; }
  .m-head .tag { margin-left:auto; font-size:9px; color:#999; }
  .m-body { padding:10px; }
  .m-say { font-size:10px; color:#777; margin-bottom:5px; }
  .m-text { font-size:14px; font-weight:700; letter-spacing:.2px; margin-bottom:7px; word-break:keep-all; line-height:1.35; }
  .m-text .typed { color:#2b7a2b; }
  .m-text .bad { color:#c62828; text-decoration:underline; }
  #m-input { width:100%; font-size:13px; padding:7px 8px; border:1px solid #cfcfcf; border-radius:5px;
             outline:none; }
  .m-timebar { height:4px; background:#eee; border-radius:3px; margin-top:8px; overflow:hidden; }
  .m-timebar i { display:block; height:100%; width:100%; background:#2b7a2b; transition:width .1s linear; }
  #mission.target .m-timebar i { background:#c62828; }

  /* ---- 화면 깨짐 연출들 ---- */
  #fx { position:fixed; inset:0; display:none; }
  #fx.show { display:block; }
  /* 유리 금 */
  .crack { position:absolute; inset:0; background:rgba(10,10,14,.12); }
  .crack svg { position:absolute; inset:0; width:100%; height:100%; }
  /* 글리치 */
  .glitch { position:absolute; inset:0; background:
     repeating-linear-gradient(0deg, rgba(255,0,60,.06) 0 2px, rgba(0,255,220,.06) 2px 4px);
     animation:gl .18s steps(2) infinite; mix-blend-mode:screen; }
  .glitch::after { content:''; position:absolute; inset:0;
     background:linear-gradient(90deg, rgba(255,0,60,.15), transparent 20%, transparent 80%, rgba(0,180,255,.15));
     animation:gl2 .12s infinite; }
  @keyframes gl { 0%{transform:translate(0)} 50%{transform:translate(-3px,1px)} 100%{transform:translate(2px,-1px)} }
  @keyframes gl2 { 0%{transform:translate(4px)} 100%{transform:translate(-4px)} }
  /* 녹아내림 */
  .melt { position:absolute; inset:0; backdrop-filter:blur(1px);
     background:linear-gradient(180deg, transparent, rgba(0,0,0,.0));
     animation:melt 1.2s ease-in forwards; }
  .melt i { position:absolute; top:0; width:3%; background:rgba(20,20,30,.5); border-radius:0 0 40% 40%;
     animation:drip 2s ease-in infinite; }
  @keyframes drip { 0%{height:0} 100%{height:100%} }
  @keyframes melt { to{backdrop-filter:blur(3px)} }
  /* 가짜 블루스크린 */
  .bsod { position:absolute; inset:0; background:#0078d7; color:#fff; padding:8vh 10vw;
     font-size:18px; line-height:1.7; }
  .bsod .face { font-size:64px; }
  .bsod .fake { position:absolute; right:10px; bottom:8px; font-size:11px; color:#bfe0ff; }

  /* 복구 미션 (깨진 화면 위) */
  #recover { position:fixed; left:50%; top:52%; transform:translate(-50%,-50%); width:460px;
     background:#101010; color:#fff; border:1px solid #333; border-radius:10px; padding:16px; display:none; }
  #recover.show { display:block; }
  #recover .r-title { font-size:13px; color:#e4342a; margin-bottom:6px; letter-spacing:1px; }
  #recover .r-text { font-size:20px; font-weight:700; margin-bottom:10px; }
  #recover .r-text .typed { color:#3ac267; }
  #r-input { width:100%; font-size:16px; padding:9px 10px; border:1px solid #333; background:#000; color:#fff;
     border-radius:6px; outline:none; }
  #recover .r-time { height:5px; background:#222; border-radius:3px; margin-top:10px; overflow:hidden; }
  #recover .r-time i { display:block; height:100%; width:100%; background:#e4342a; }
  .esc-hint { position:fixed; left:8px; bottom:6px; font-size:10px; color:rgba(255,255,255,.35); }
</style>
</head>
<body>
<div id="layer">
  <div id="fx"></div>

  <div id="mission">
    <div class="m-head" id="m-head"><span class="ic"></span><span id="m-title">알림</span><span class="tag" id="m-tag"></span></div>
    <div class="m-body">
      <div class="m-say" id="m-say">아래 문장을 제한 시간 안에 그대로 입력하세요.</div>
      <div class="m-text" id="m-text"></div>
      <input id="m-input" autocomplete="off" spellcheck="false" />
      <div class="m-timebar"><i id="m-bar"></i></div>
    </div>
  </div>

  <div id="recover">
    <div class="r-title">⚠ 화면 복구 — 빨리 입력</div>
    <div class="r-text" id="r-text"></div>
    <input id="r-input" autocomplete="off" spellcheck="false" />
    <div class="r-time"><i id="r-bar"></i></div>
  </div>

  <div class="esc-hint" id="escHint" style="display:none">ESC</div>
</div>
<script src="overlay.js"></script>
</body>
</html>
