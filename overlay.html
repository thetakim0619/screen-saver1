<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<style>
  * { box-sizing:border-box; font-family:'Pretendard','Malgun Gothic',system-ui,sans-serif;
      -webkit-user-select:none; }
  html,body { margin:0; width:100vw; height:100vh; overflow:hidden; background:transparent; cursor:default; }
  #layer { position:fixed; inset:0; pointer-events:none; }
  .on { pointer-events:auto; }

  /* ---- 미션 카드 (업무 알림처럼 생긴 작은 창) ---- */
  #mission { position:fixed; right:18px; bottom:18px; width:260px; background:#fbfbfb; color:#1b1b1b;
             border:1px solid #d6d6d6; border-radius:7px; box-shadow:0 8px 24px rgba(0,0,0,.28);
             display:none; overflow:hidden; font-size:12px; }
  #mission.show { display:block; }
  .m-head { background:#f1f1f1; border-bottom:1px solid #e2e2e2; padding:6px 10px; font-size:11px;
            color:#555; display:flex; align-items:center; gap:6px; }
  .m-head .ic { width:11px; height:11px; border-radius:3px; background:#2b7a2b; }
  .m-head.target .ic { background:#c62828; }
  .m-head .tag { margin-left:auto; font-size:9px; color:#999; }
  .m-body { padding:10px; }
  .m-say { font-size:10px; color:#777; margin-bottom:5px; }
  .m-text { font-size:14px; font-weight:700; letter-spacing:.2px; margin-bottom:7px; word-break:keep-all; line-height:1.35; }
  .m-text .typed { color:#2b7a2b; }
  .m-text .bad { color:#c62828; text-decoration:underline; }
  #m-input { width:100%; font-size:13px; padding:7px 8px; border:1px solid #cfcfcf; border-radius:5px;
             outline:none; }
  .m-timebar { height:4px; background:#eee; border-radius:3px; margin-top:8px; overflow:hidden; }
  .m-timebar i { display:block; height:100%; width:100%; background:#2b7a2b; transition:width .1s linear; }
  #mission.target .m-timebar i { background:#c62828; }

  /* ---- 화면 깨짐 연출들 ---- */
  #fx { position:fixed; inset:0; display:none; }
  #fx.show { display:block; }
  /* 유리 금 */
  .crack { position:absolute; inset:0; background:rgba(10,10,14,.12); }
  .crack svg { position:absolute; inset:0; width:100%; height:100%; }
  /* 글리치 */
  .glitch { position:absolute; inset:0; background:
     repeating-linear-gradient(0deg, rgba(255,0,60,.06) 0 2px, rgba(0,255,220,.06) 2px 4px);
     animation:gl .18s steps(2) infinite; mix-blend-mode:screen; }
  .glitch::after { content:''; position:absolute; inset:0;
     background:linear-gradient(90deg, rgba(255,0,60,.15), transparent 20%, transparent 80%, rgba(0,180,255,.15));
     animation:gl2 .12s infinite; }
  @keyframes gl { 0%{transform:translate(0)} 50%{transform:translate(-3px,1px)} 100%{transform:translate(2px,-1px)} }
  @keyframes gl2 { 0%{transform:translate(4px)} 100%{transform:translate(-4px)} }
  /* 녹아내림 */
  .melt { position:absolute; inset:0; backdrop-filter:blur(1px);
     background:linear-gradient(180deg, transparent, rgba(0,0,0,.0));
     animation:melt 1.2s ease-in forwards; }
  .melt i { position:absolute; top:0; width:3%; background:rgba(20,20,30,.5); border-radius:0 0 40% 40%;
     animation:drip 2s ease-in infinite; }
  @keyframes drip { 0%{height:0} 100%{height:100%} }
  @keyframes melt { to{backdrop-filter:blur(3px)} }
  /* 가짜 블루스크린 */
  .bsod { position:absolute; inset:0; background:#0078d7; color:#fff; padding:8vh 10vw;
     font-size:18px; line-height:1.7; }
  .bsod .face { font-size:64px; }
  .bsod .fake { position:absolute; right:10px; bottom:8px; font-size:11px; color:#bfe0ff; }

  /* ===== 이미지 기반 연출 (검은 부분은 알파로 투명, 균열/액체/글리치만 화면 위에 뜸) ===== */
  .fximg { position:absolute; inset:0; background-size:cover; background-position:center;
           background-repeat:no-repeat; will-change:transform,opacity,clip-path; pointer-events:none; }
  video.fximg { width:100%; height:100%; object-fit:cover; }
  .fxcanvas { width:100%; height:100%; object-fit:cover; display:block; }
  #fx .custimg { background-color:#000; background-size:contain; background-position:center; background-repeat:no-repeat; }
  /* 커스텀 이미지 등장 연출 프리셋 */
  #fx .custimg.cfx-slam { animation: cfSlam .5s cubic-bezier(.2,1.5,.4,1) both, fxshake .45s .5s 2; transform-origin:center; }
  @keyframes cfSlam { 0%{transform:scale(2.6);opacity:0} 12%{opacity:1} 55%{transform:scale(.93)} 78%{transform:scale(1.04)} 100%{transform:scale(1)} }
  #fx .custimg.cfx-shake { animation: fxshake .3s linear infinite; }
  #fx .custimg.cfx-glitch { animation: gJit .26s steps(2) infinite, gFlick .9s steps(1) infinite; }
  #fx .imgdrop { position:absolute; top:-15%; background-size:contain; background-position:center; background-repeat:no-repeat; will-change:top,transform; }

  /* ===== 귀여운 연출 (스티커 폭탄 / 뿅 캐릭터) ===== */
  .cute { position:absolute; inset:0; pointer-events:none; overflow:hidden; }
  .cute .sticker { position:absolute; transform:scale(0); animation: cPop .5s cubic-bezier(.34,1.56,.64,1) both, cWob 2.2s ease-in-out infinite; }
  .cute .sticker svg { width:100%; height:100%; display:block; filter:drop-shadow(0 2px 2px rgba(0,0,0,.25)); }
  @keyframes cPop { 0%{transform:scale(0) rotate(var(--r,0deg))} 60%{transform:scale(1.25) rotate(var(--r,0deg))} 100%{transform:scale(1) rotate(var(--r,0deg))} }
  @keyframes cWob { 0%,100%{margin-top:0} 50%{margin-top:-4px} }
  .cute .cbubble { position:absolute; left:50%; top:44%; transform:translate(-50%,-50%) scale(0);
    background:#fff; color:#ff5d8f; font-weight:800; font-size:calc(var(--u,6px)*7); line-height:1;
    padding:calc(var(--u,6px)*.35) calc(var(--u,6px)*.8); border-radius:999px; border:calc(var(--u,6px)*.5) solid #ffd1e0;
    box-shadow:0 8px 22px rgba(0,0,0,.25); white-space:nowrap; font-family:'Pretendard','Malgun Gothic',system-ui,sans-serif;
    animation: cBub .6s .25s cubic-bezier(.34,1.8,.64,1) both, cWob 1.8s .9s ease-in-out infinite; }
  @keyframes cBub { 0%{transform:translate(-50%,-50%) scale(0) rotate(-8deg)} 70%{transform:translate(-50%,-50%) scale(1.15) rotate(3deg)} 100%{transform:translate(-50%,-50%) scale(1) rotate(0)} }
  .cute .mochi { position:absolute; left:50%; bottom:7%; width:calc(var(--u,6px)*42); transform:translateX(-50%);
    animation: cRise .55s cubic-bezier(.34,1.56,.64,1) both, cBoing 1.6s .7s ease-in-out infinite; }
  .cute .mochi svg { width:100%; height:auto; display:block; filter:drop-shadow(0 10px 18px rgba(0,0,0,.3)); }
  @keyframes cRise { 0%{transform:translate(-50%,130%)} 100%{transform:translate(-50%,0)} }
  @keyframes cBoing { 0%,100%{transform:translate(-50%,0)} 50%{transform:translate(-50%,-12px)} }
  .cute .spark { position:absolute; color:#fff3b0; font-size:calc(var(--u,6px)*5); opacity:0; text-shadow:0 0 8px #ffd166;
    animation: cTwk 1.4s ease-in-out infinite; }
  @keyframes cTwk { 0%,100%{opacity:0;transform:scale(.4)} 50%{opacity:1;transform:scale(1.2)} }
  /* 스티커 비(우르르 쏟아짐) */
  .cute .raindrop { position:absolute; top:-12%; will-change:top,transform; }
  .cute .raindrop svg { width:100%; height:100%; display:block; filter:drop-shadow(0 2px 2px rgba(0,0,0,.2)); }
  @keyframes cFall { to { top:115%; transform:rotate(var(--spin,360deg)); } }
  .fx-flash { position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; }
  #fx.shake { animation: fxshake .5s cubic-bezier(.36,.07,.19,.97) both; }
  @keyframes fxshake { 10%,90%{transform:translate(-2px,1px)} 20%,80%{transform:translate(5px,-2px)}
    30%,50%,70%{transform:translate(-9px,2px)} 40%,60%{transform:translate(9px,-1px)} }
  /* 유리: 번쩍 + 쾅 스냅인 */
  @keyframes crackIn { 0%{opacity:0;transform:scale(1.16)} 10%{opacity:1} 100%{opacity:1;transform:scale(1)} }
  .crackIn { animation: crackIn .45s ease-out both; }
  @keyframes flashHit { 0%{opacity:0} 5%{opacity:.9} 28%{opacity:0} 100%{opacity:0} }
  .flashHit { animation: flashHit .5s ease-out both; }
  /* 글리치: 떨림 + 깜빡 */
  @keyframes gJit { 0%{transform:translate(0,0)} 20%{transform:translate(-7px,1px)} 40%{transform:translate(6px,-2px)}
    60%{transform:translate(-4px,2px)} 80%{transform:translate(5px,0)} 100%{transform:translate(0,0)} }
  @keyframes gFlick { 0%,100%{opacity:1} 44%{opacity:.55} 50%{opacity:.12} 56%{opacity:.85} }
  .glitchAnim { animation: gJit .2s steps(2) infinite, gFlick .5s steps(1) infinite; }
  /* 멜트: 위에서 아래로 흘러내림 + 좌우 흔들 */
  @keyframes meltDown { 0%{clip-path:inset(0 0 100% 0)} 100%{clip-path:inset(0 0 0 0)} }
  @keyframes meltSway { 0%,100%{transform:translateX(0)} 50%{transform:translateX(5px)} }
  .meltAnim { animation: meltDown 1.5s ease-in both, meltSway 3.2s ease-in-out .2s infinite; }

  /* 복구 미션 (깨진 화면 위) */
  /* 복구 미션 — 방어 미션(#mission)과 같은 오른쪽 아래 위치·크기 */
  #recover { position:fixed; right:18px; bottom:18px; width:260px;
     background:#101010; color:#fff; border:1px solid #333; border-radius:7px; padding:12px; display:none; }
  #recover.show { display:block; }
  #recover .r-title { font-size:11px; color:#e4342a; margin-bottom:6px; letter-spacing:.5px; }
  #recover .r-text { font-size:15px; font-weight:700; margin-bottom:8px; }
  #recover .r-text .typed { color:#3ac267; }
  #r-input { width:100%; font-size:13px; padding:7px 8px; border:1px solid #333; background:#000; color:#fff;
     border-radius:5px; outline:none; }
  #recover .r-time { height:4px; background:#222; border-radius:3px; margin-top:8px; overflow:hidden; }
  #recover .r-time i { display:block; height:100%; width:100%; background:#e4342a; }
  .esc-hint { position:fixed; left:8px; bottom:6px; font-size:10px; color:rgba(255,255,255,.35); }
</style>
</head>
<body>
<div id="layer">
  <div id="fx"></div>

  <div id="mission">
    <div class="m-head" id="m-head"><span class="ic"></span><span id="m-title">알림</span><span class="tag" id="m-tag"></span></div>
    <div class="m-body">
      <div class="m-say" id="m-say">아래 문장을 제한 시간 안에 그대로 입력하세요.</div>
      <div class="m-text" id="m-text"></div>
      <input id="m-input" autocomplete="off" spellcheck="false" />
      <div class="m-timebar"><i id="m-bar"></i></div>
    </div>
  </div>

  <div id="recover">
    <div class="r-title">⚠ 화면 복구 — 빨리 입력</div>
    <div class="r-text" id="r-text"></div>
    <input id="r-input" autocomplete="off" spellcheck="false" />
    <div class="r-time"><i id="r-bar"></i></div>
  </div>

  <div class="esc-hint" id="escHint" style="display:none">ESC</div>
</div>
<script src="overlay.js"></script>
</body>
</html>
